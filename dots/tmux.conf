set -g prefix C-s

# Truecolor support
set -sa terminal-features ',xterm-256color:RGB'
# Enable mouse support
set -g mouse on

# Start windows at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Move panels
bind -n C-S-M-Left swap-window -t -1 \;  previous-window
bind -n C-S-M-Right swap-window -t +1 \; next-window

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  config reloaded"

# Enter copy mode with prefix d
bind d copy-mode

# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# ─── Rosé Pine rice (matches nvim rose-pine + sketchybar + starship)
# Palette
set -g @base    "#191724"
set -g @overlay "#26233a"
set -g @hl_med  "#403d52"
set -g @muted   "#6e6a86"
set -g @subtle  "#908caa"
set -g @text    "#e0def4"
set -g @love    "#eb6f92"
set -g @gold    "#f6c177"
set -g @rose    "#ebbcba"
set -g @foam    "#9ccfd8"
set -g @iris    "#c4a7e7"

# Floating bar: top, transparent bg (terminal shows through), one empty row of breathing room below
set -g status-position top
set -g status-interval 5
set -g status 2
set -g status-format[1] ""
set -g status-style "bg=default,fg=#908caa"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Session pill — iris normally, gold while prefix is held, foam in copy mode
set -g @mode_color "#{?client_prefix,#{@gold},#{?pane_in_mode,#{@foam},#{@iris}}}"
set -g status-left "#[fg=#{E:@mode_color},bg=default]#[fg=#{@base},bg=#{E:@mode_color},bold] #S#[fg=#{E:@mode_color},bg=default,nobold]  "

# Windows — dim text for inactive, rose pill for current, zoom/activity markers
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted},bg=default] #I #W#{?window_zoomed_flag, 󰁌,}#{?window_activity_flag, #[fg=#{@gold}]●,} "
set -g window-status-current-format "#[fg=#{@rose},bg=default]#[fg=#{@base},bg=#{@rose},bold]#I #W#{?window_zoomed_flag, 󰁌,}#[fg=#{@rose},bg=default,nobold]"
set -g renumber-windows on
setw -g monitor-activity on
set -g visual-activity off

# Right side — current dir (dim) + clock pill
set -g status-right "#[fg=#{@muted}] #{b:pane_current_path}  #[fg=#{@foam},bg=default]#[fg=#{@base},bg=#{@foam},bold] %H:%M#[fg=#{@foam},bg=default,nobold]"

# Messages, copy mode, menus, popups
set -g message-style "fg=#eb6f92,bg=default,bold"
set -g message-command-style "fg=#9ccfd8,bg=default"
set -g mode-style "bg=#403d52"
set -gq copy-mode-match-style "bg=#403d52"
set -gq copy-mode-current-match-style "fg=#e0def4,bg=#403d52,bold"
set -g clock-mode-colour "#eb6f92"
set -gq menu-style "fg=#908caa,bg=#191724"
set -gq menu-selected-style "bg=#403d52"
set -gq menu-border-style "fg=#c4a7e7"
set -gq menu-border-lines rounded
set -gq popup-style "bg=#191724"
set -gq popup-border-style "fg=#c4a7e7"
set -gq popup-border-lines rounded

# Pane borders — dim by default, iris on the active pane
set -g pane-border-lines heavy
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#c4a7e7"
set -gq pane-border-indicators colour
# prefix b toggles pane titles (index + running command) on the borders
set -g pane-border-format "#[fg=#{?pane_active,#{@iris},#{@muted}}] #P · #{pane_current_command} "
bind b if -F "#{==:#{pane-border-status},off}" "set -w pane-border-status top" "set -w pane-border-status off"

# Floating scratch shell in the current dir (prefix t)
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Undercurl + coloured underlines passthrough (nvim diagnostics)
set -as terminal-features ',*:usstyle'

# dim inactive windows
set -g focus-events on
setw -g window-active-style 'fg=#908caa,bg=default'
setw -g window-style 'fg=#6e6a86,bg=default'




# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
