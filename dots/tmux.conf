set -g prefix C-s

# Truecolor support
set -sa terminal-features ',xterm-256color:RGB'
# Enable mouse support
set -g mouse on

# Start windows at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Move panels
bind -n C-S-M-Left swap-window -t -1 \;  previous-window
bind -n C-S-M-Right swap-window -t +1 \; next-window

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Enter copy mode with prefix d
bind d copy-mode

# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# Rosé Pine theme
# base #191724  surface #1f1d2e  overlay #26233a  muted #6e6a86  subtle #908caa
# text #e0def4  love #eb6f92  gold #f6c177  rose #ebbcba  pine #31748f  foam #9ccfd8  iris #c4a7e7
set -g status-position top
set -g status-style "bg=#191724,fg=#908caa"
set -g status-left "#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=#191724,nobold]  "
set -g status-right "#[fg=#9ccfd8,bg=#191724] %H:%M  #[fg=#191724,bg=#9ccfd8,bold] #H "
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-format "#[fg=#6e6a86,bg=#191724] #I:#W "
set -g window-status-current-format "#[fg=#191724,bg=#ebbcba,bold] #I:#W #[fg=#ebbcba,bg=#191724,nobold]"
set -g window-status-separator ""
set -g message-style "fg=#e0def4,bg=#26233a"
set -g message-command-style "fg=#eb6f92,bg=#26233a"
set -g mode-style "fg=#191724,bg=#c4a7e7"
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"

# dim inactive windows
set -g focus-events on
setw -g window-active-style 'fg=#e0def4,bg=#191724'
setw -g window-style 'fg=#6e6a86,bg=#1f1d2e'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
