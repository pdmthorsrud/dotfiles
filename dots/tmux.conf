set -g prefix C-s

# Truecolor support
set -sa terminal-features ',xterm-256color:RGB'
# Enable mouse support
set -g mouse on

# Start windows at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Move panels
bind -n C-S-M-Left swap-window -t -1 \;  previous-window
bind -n C-S-M-Right swap-window -t +1 \; next-window

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.tmux.conf \; display-message "  config reloaded"

# Enter copy mode with prefix d
bind d copy-mode

# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# ─── Fluoromachine rice (matches nvim fluoromachine + lualine bubbles + sketchybar pills)
# Palette
set -g @bg      "#241B2F"
set -g @surface "#463465"
set -g @muted   "#495495"
set -g @fg      "#8BA7A7"
set -g @pink    "#FC199A"
set -g @purple  "#AF6DF9"
set -g @cyan    "#61E2FF"
set -g @green   "#72F1B8"
set -g @sep     "#8C57C7"
set -g @select  "#463465"
set -g @orange  "#FF8B39"

# Floating bar: top, transparent bg (terminal shows through), one empty row of breathing room below
set -g status-position top
set -g status-interval 5
set -g status 2
set -g status-format[1] ""
set -g status-style "bg=default,fg=#8BA7A7"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Session pill — pink normally, orange while prefix is held (= nvim command), cyan in copy mode (= nvim visual)
set -g @mode_color "#{?client_prefix,#{@orange},#{?pane_in_mode,#{@cyan},#{@pink}}}"
set -g status-left "#[fg=#{E:@mode_color},bg=default]#[fg=#{@bg},bg=#{E:@mode_color},bold] #S#[fg=#{E:@mode_color},bg=default,nobold]  "

# Windows — dim text for inactive, purple pill for current, zoom/activity markers
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted},bg=default] #I #W#{?window_zoomed_flag, 󰁌,}#{?window_activity_flag, #[fg=#{@orange}]●,} "
set -g window-status-current-format "#[fg=#{@purple},bg=default]#[fg=#{@bg},bg=#{@purple},bold]#I #W#{?window_zoomed_flag, 󰁌,}#[fg=#{@purple},bg=default,nobold]"
set -g renumber-windows on
setw -g monitor-activity on
set -g visual-activity off

# Right side — current dir (dim) + clock pill
set -g status-right "#[fg=#{@muted}] #{b:pane_current_path}  #[fg=#{@cyan},bg=default]#[fg=#{@bg},bg=#{@cyan},bold] %H:%M#[fg=#{@cyan},bg=default,nobold]"

# Messages, copy mode, menus, popups
set -g message-style "fg=#FC199A,bg=default,bold"
set -g message-command-style "fg=#61E2FF,bg=default"
set -g mode-style "bg=#463465"
set -gq copy-mode-match-style "bg=#463465"
set -gq copy-mode-current-match-style "fg=#FFFFFF,bg=#463465,bold"
set -g clock-mode-colour "#FC199A"
set -gq menu-style "fg=#8BA7A7,bg=#241B2F"
set -gq menu-selected-style "bg=#463465"
set -gq menu-border-style "fg=#8C57C7"
set -gq menu-border-lines rounded
set -gq popup-style "bg=#241B2F"
set -gq popup-border-style "fg=#8C57C7"
set -gq popup-border-lines rounded

# Pane borders — nvim WinSeparator violet, neon green on the active pane
set -g pane-border-lines heavy
set -g pane-border-style "fg=#8C57C7"
set -g pane-active-border-style "fg=#72F1B8"
set -gq pane-border-indicators colour
# prefix b toggles pane titles (index + running command) on the borders
set -g pane-border-format "#[fg=#{?pane_active,#{@green},#{@muted}}] #P · #{pane_current_command} "
bind b if -F "#{==:#{pane-border-status},off}" "set -w pane-border-status top" "set -w pane-border-status off"

# Floating scratch shell in the current dir (prefix t)
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Undercurl + coloured underlines passthrough (nvim diagnostics)
set -as terminal-features ',*:usstyle'

# dim inactive windows
set -g focus-events on
setw -g window-active-style 'fg=#8BA7A7,bg=default'
setw -g window-style 'fg=#495495,bg=default'




# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
